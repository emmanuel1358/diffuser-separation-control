schema_version = "1.1"

[task]
name = "labelbox/prometheus-replace-me"
description = "Replace with the Prometheus task description (data/model submission scored by a continuous function)."

[delivery]
# Mothership routes passing tasks to Prometheus instead of Taiga when set.
platform = "prometheus"

[environment]
# Pick exactly one Taiga-supported resource enum (copy it verbatim). The suffix
# is the accelerator share, e.g. "+h100/2" = HALF an H100, "+h100/1" = a whole
# one, "+tpuv5e1x1" = one v5e TPU chip. vCPU/GiB are the CPU+RAM share.
#   TPU:  13vcpu+32gib+tpuv5e1x1 | 16vcpu+64gib+tpuv5e2x2 | 50vcpu+128gib+tpuv5e2x2
#   H100: 24vcpu+200gib+h100/1 | 12vcpu+100gib+h100/2 | 6vcpu+50gib+h100/4 | 3vcpu+25gib+h100/8
# ML tasks deploy on TPU by default (faster on Taiga); references run on GPU.
# Switch to an h100/* tier only if the task genuinely cannot run on a TPU.
required_resources = "13vcpu+32gib+tpuv5e1x1"
storage_mb = 50000
# LOCKED OFF: the sandbox runs offline and this is not author-controllable.
# Validation hard-fails allow_internet = true. Fetch deps/data at build time.
allow_internet = false

[agent]
# Optional. Omit to inherit Taiga's maximum agent timeout; only set a smaller
# value if the task should deliberately run shorter than the platform max.
timeout_sec = 1800
user = "agent"

[verifier]
# Optional. The Taiga grading timeout for ml tasks is NOT author-controlled:
# the exporter always pins it to Taiga's maximum (10800s) regardless of this
# value, so real ML grading is never capped. This knob only affects the local
# in-image verifier subprocess.
timeout_sec = 600
user = "root"
env = []

[difficulty]
# task_type enum: ml | mujoco | cfd | structures
task_type = "ml"
# domain enum scoped by task_type. Replace with a value from DOMAINS_BY_TASK_TYPE.
domain = "scientific_discovery_computational_science"
# reward_type enum: continuous_scoring_function | multi_deterministic_rubrics
reward_type = "continuous_scoring_function"
# license: permissive SPDX id, REQUIRED for ml tasks. Trace the dataset license
# upstream and pick one of: MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC,
# Unlicense, CC0-1.0, CC-BY-4.0, PDDL-1.0, UPL-1.0. Copyleft / non-commercial /
# research-only data is not permitted. Use "self_generated" only when the task
# produces its own data (e.g. fully synthetic data with no external dataset).
license = "MIT"
# license_source: REQUIRED for ml tasks. The upstream-most http(s) URL where you
# confirmed the license (not a HF/Kaggle mirror, which often misstate it) -- a
# licensing reviewer verifies this by hand before the task ships. When
# license = "self_generated", put a short reason instead (e.g. "fully synthetic
# data generated by solution/generate.py; no external dataset").
license_source = "https://REPLACE_ME-upstream-source-where-license-was-confirmed"
[[outputs]]
path = "/tmp/output/answer.txt"
required = true
description = "Final answer or artifact"
