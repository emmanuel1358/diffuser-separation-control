schema_version = "1.1"

[task]
name = "labelbox/prometheus-cfd-replace-me"
description = "Author or repair a CFD case scored deterministically, then submit passing CI to Prometheus and Taiga."

[delivery]
# Mothership keeps the normal CFD trusted-CI gates, then submits independently
# to the Prometheus Agent Service runner and the dedicated Taiga mirror.
platform = "prometheus"
eval = false

[environment]
required_resources = "4vcpu+16gib"
storage_mb = 10000
allow_internet = true

[agent]
timeout_sec = 1800
user = "agent"

[runner.timeouts]
setup_sec = 1800
grading_sec = 1200
tool_sec = 600
max_episode_sec = 1800

[verifier]
# CFD grading runs the solver for each hidden condition sequentially, so the
# verifier wall must exceed that worst case. Tune to your case count x per-case
# timeout.
timeout_sec = 1200
user = "root"
env = []

[difficulty]
task_type = "cfd"
domain = "aerodynamics"
reward_type = "multi_deterministic_rubrics"
[ground_truth]
in_container = true
render_command = "bash solution/render.sh"
render_outputs = [
  { path = "/tmp/output/rendering.mp4", required = true, description = "Reviewer video of the oracle case (e.g. animated flow field)" },
]

[[outputs]]
path = "/tmp/output/control.json"
required = true
description = "CFD design/control parameters graded by hidden flow conditions"
