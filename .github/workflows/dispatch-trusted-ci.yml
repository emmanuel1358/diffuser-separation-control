name: Template Trusted CI Handoff

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "problems/**"
      - "examples/**"
      - "grader/**"
      - "harness/**"
      - "alignerr_plugin/**"
      - "base/**"
      - "configs/**"
      - "scripts/**"
      - "docs/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - ".github/PULL_REQUEST_TEMPLATE/**"
      - ".github/scripts/template_ci_handoff_comment.py"
      - ".github/workflows/dispatch-trusted-ci.yml"
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Template PR number to grade"
        required: true
        type: string
      pr_head_sha:
        description: "Optional expected PR head SHA"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Resolve template PR context
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PR_NUMBER: ${{ github.event.inputs.pr_number }}
          INPUT_HEAD_SHA: ${{ github.event.inputs.pr_head_sha }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_HEAD_REPO: ${{ github.event.pull_request.head.repo.name }}
          EVENT_HEAD_OWNER: ${{ github.event.pull_request.head.repo.owner.login }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "pull_request_target" ]]; then
            pr_number="${EVENT_PR_NUMBER}"
            head_sha="${EVENT_HEAD_SHA}"
            fork_name="${EVENT_HEAD_REPO}"
            fork_owner="${EVENT_HEAD_OWNER}"
          else
            pr_number="${INPUT_PR_NUMBER}"
            pr_json="$(gh pr view "${pr_number}" --repo "${GITHUB_REPOSITORY}" --json headRefOid,headRepository,headRepositoryOwner)"
            head_sha="$(PR_JSON="${pr_json}" python3 - <<'PY'
          import json, os
          print(json.loads(os.environ["PR_JSON"])["headRefOid"])
          PY
          )"
            fork_name="$(PR_JSON="${pr_json}" python3 - <<'PY'
          import json, os
          print(json.loads(os.environ["PR_JSON"])["headRepository"]["name"])
          PY
          )"
            fork_owner="$(PR_JSON="${pr_json}" python3 - <<'PY'
          import json, os
          print(json.loads(os.environ["PR_JSON"])["headRepositoryOwner"]["login"])
          PY
          )"
            if [[ -n "${INPUT_HEAD_SHA:-}" && "${head_sha}" != "${INPUT_HEAD_SHA}" ]]; then
              echo "::error::PR head moved: expected ${INPUT_HEAD_SHA}, current ${head_sha}"
              exit 1
            fi
          fi
          if [[ "${fork_owner}" != "Alignerr-Code-Labeling" ]]; then
            echo "::error::ISO mothership trusted CI expects an Alignerr-Code-Labeling source repo; got ${fork_owner}/${fork_name}"
            exit 1
          fi
          {
            echo "pr_number=${pr_number}"
            echo "head_sha=${head_sha}"
            echo "fork_name=${fork_name}"
          } >> "$GITHUB_OUTPUT"

      # The queued/dispatched acknowledgment now comes from the ISO mothership
      # under the GitHub App identity (grade-fork-pr.yml -> prepare-check). The
      # fork only posts on failure below, so a dispatch that never reaches the
      # mothership is still surfaced to the author.
      - name: Dispatch trusted CI to ISO mothership
        env:
          DISPATCH_TOKEN: ${{ secrets.RL_TASKS_GH_WORKFLOW_TOKEN }}
          FORK_NAME: ${{ steps.pr.outputs.fork_name }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          PR_HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          set -euo pipefail
          if [[ -z "${DISPATCH_TOKEN:-}" ]]; then
            echo "::error::RL_TASKS_GH_WORKFLOW_TOKEN is required to dispatch ISO mothership trusted CI."
            exit 1
          fi
          payload="$(python3 - <<'PY'
          import json, os
          print(json.dumps({
              "event_type": "fork-pr",
              "client_payload": {
                  "fork_name": os.environ["FORK_NAME"],
                  "pr_number": os.environ["PR_NUMBER"],
                  "pr_head_sha": os.environ["PR_HEAD_SHA"],
              },
          }))
          PY
          )"
          curl -sSf -X POST \
            -H "Authorization: Bearer ${DISPATCH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d "${payload}" \
            "https://api.github.com/repos/Alignerr-Code-Labeling/lbx-rl-tasks-iso-mothership/dispatches"

      - name: Comment handoff failure
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.RL_TASKS_GH_WORKFLOW_TOKEN || github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number || github.event.pull_request.number || github.event.inputs.pr_number }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha || github.event.pull_request.head.sha || github.event.inputs.pr_head_sha }}
          ACTIONS_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 .github/scripts/template_ci_handoff_comment.py \
            --repo "${GITHUB_REPOSITORY}" \
            --pr-number "${PR_NUMBER}" \
            --kind trusted-ci \
            --state failed \
            --head-sha "${HEAD_SHA}" \
            --target-workflow grade-fork-pr.yml \
            --actions-run-url "${ACTIONS_RUN_URL}"
