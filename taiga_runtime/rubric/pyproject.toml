[project]
name = "rubric"
version = "0.1.0"
description = "Generic MCP runtime for Alignerr RL tasks"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]==1.27.1",
    "mujoco==3.8.0",
    "numpy==2.4.4",
    "pydantic==2.13.4",
    "typer==0.25.1",
]

[project.scripts]
rubric = "rubric.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rubric"]
