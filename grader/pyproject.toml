[project]
name = "lbx-rl-tasks-grading"
version = "0.1.0"
description = "Shared grading library and grader runner for Alignerr RL tasks."
requires-python = ">=3.12"
dependencies = [
    "httpx==0.28.1",
    "json-numpy==2.1.1",
    "msgpack==1.2.0",
]

[project.scripts]
run-grader = "grader_runner.run_grader:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grading", "src/grader_runner", "src/env_server"]
